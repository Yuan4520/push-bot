name: Daily WeChat Push

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC.
    # 00:10/02:35/02:45/06:10/12:10 UTC = 08:10/10:35/10:45/14:10/20:10 Asia/Shanghai.
    - cron: "10 0 * * *"
    - cron: "35 2 * * *"
    - cron: "45 2 * * *"
    - cron: "10 6 * * *"
    - cron: "10 12 * * *"

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      BOT_CONFIG_B64: ${{ secrets.BOT_CONFIG_B64 }}
      JIPIAO_CONFIG_B64: ${{ secrets.JIPIAO_CONFIG_B64 }}
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required secrets
        run: |
          test -n "$SERVERCHAN_SENDKEY" || (echo "Missing SERVERCHAN_SENDKEY secret" && exit 1)
          test -n "$BOT_CONFIG_B64" || (echo "Missing BOT_CONFIG_B64 secret" && exit 1)
          test -n "$JIPIAO_CONFIG_B64" || (echo "Missing JIPIAO_CONFIG_B64 secret" && exit 1)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r references/JiPiao-master/requirements.txt

      - name: Write private configs
        run: |
          printf '%s' "$BOT_CONFIG_B64" | base64 --decode > config.json
          printf '%s' "$JIPIAO_CONFIG_B64" | base64 --decode > references/JiPiao-master/config.yaml

      - name: Fetch flight prices
        working-directory: references/JiPiao-master
        run: python main.py --once

      - name: Send daily brief
        run: python push_bot.py --config config.json
