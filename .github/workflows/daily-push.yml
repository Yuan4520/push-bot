name: Daily WeChat Push

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC.
    # 02:00 UTC = 10:00 Asia/Shanghai.
    - cron: "0 2 * * *"

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required secrets
        run: |
          test -n "$SERVERCHAN_SENDKEY" || (echo "Missing SERVERCHAN_SENDKEY secret" && exit 1)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Send daily brief
        run: python push_bot.py --config config.json --brief-only
